name: Build HarmonyOS (ohos)

on:
  workflow_dispatch:
  push:
    branches:
      - ohos-support
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  FLUTTER_OHOS_BRANCH: oh-3.47.4-dev

jobs:
  build_ohos:
    name: Build ohos HAP (unsigned)
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # Windows 宿主：oh-flutter 官方仅提供 windows/darwin 的定制 dart-sdk
      # （含 Abi.ohosArm 扩展，编译 flutter_tools 必需），Linux 无法引导
      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@main
        with:
          version: 26.0.0.821
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache flutter-ohos SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter
          key: ohflutter-3.47.4-dev-win

      - name: Setup flutter-ohos
        run: |
          if [ ! -d "$RUNNER_TEMP/flutter/bin" ]; then
            for i in 1 2 3; do
              git clone -b $FLUTTER_OHOS_BRANCH --depth 1 https://atomgit.com/oh-flutter/flutter_flutter.git "$RUNNER_TEMP/flutter" && break
              echo "clone failed, retrying ($i)..."; sleep 15
              rm -rf "$RUNNER_TEMP/flutter"
            done
            # 浅克隆无 tag 会让 flutter 版本解析成 unknown，pub 求解必败；补拉版本 tag。
            # Windows 路径 260 限制需开 longpaths（flutter/packages 内有超长文件名）
            git config --global core.longpaths true
            git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.4-ohos-1.0.4 || true
            git -C "$RUNNER_TEMP/flutter" tag --list
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash

      # flutter_tools 的 pub 依赖里有 SSH 形式的 atomgit 仓库，重写为 HTTPS
      - name: Rewrite SSH git URLs to HTTPS
        run: git config --global url."https://atomgit.com/".insteadOf "git@atomgit.com:"
        shell: bash

      # flutter_tools / hvigor 插件补丁（.so.N 版本库复制），幂等重放
      - name: Patch flutter_tools (versioned .so copy)
        run: |
          cd "$RUNNER_TEMP/flutter"
          git checkout -- packages/flutter_tools/lib/src/ohos/ohos_builder.dart 2>/dev/null || true
          git checkout -- packages/flutter_tools/hvigor/src/plugin/flutter-hvigor-plugin.ts 2>/dev/null || true
          python "$GITHUB_WORKSPACE/tool/patch_ohflutter_tools.py" "$RUNNER_TEMP/flutter"
          rm -f bin/cache/flutter_tools.stamp bin/cache/flutter_tools.snapshot
        shell: bash

      - name: Bootstrap flutter-ohos
        run: flutter --version
        shell: bash

      # 本地路径依赖的伴生仓库（媒体引擎全家桶与弹幕引擎）
      - name: Clone companion repos
        run: |
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/liuchuancong/media_core.git "$RUNNER_TEMP/media_core" && break
            sleep 15
          done
          for i in 1 2 3; do
            git clone https://github.com/Predidit/media-kit.git "$RUNNER_TEMP/media-kit-predidit" && break
            sleep 15
          done
          cd "$RUNNER_TEMP/media-kit-predidit"
          git checkout 803c4a27912091db6f839d48d1b984a0d9f588c7
        shell: bash

      # 伴生仓库的鸿蒙适配补丁（源仓库不含这些改动）
      - name: Apply companion repo patches
        run: |
          git -C "$RUNNER_TEMP/media_core" apply "$GITHUB_WORKSPACE/tool/patches/media_core_ohos.patch"
          git -C "$RUNNER_TEMP/media-kit-predidit" apply "$GITHUB_WORKSPACE/tool/patches/media_kit_ohos.patch"
          # CPF 版 libmpv（openharmony EGL 上下文，97MB）：从本仓库 Release 资产获取
          mkdir -p "$RUNNER_TEMP/media-kit-predidit/media_kit/hook/ohos_libmpv"
          curl -fL --retry 3 -o "$RUNNER_TEMP/media-kit-predidit/media_kit/hook/ohos_libmpv/libmpv.so.2" \
            https://github.com/FiveHair/pure_live/releases/download/ohos-assets/libmpv.so.2
          ls -la "$RUNNER_TEMP/media-kit-predidit/media_kit/hook/ohos_libmpv/"
        shell: bash

      - name: Rewrite local paths to CI locations
        run: |
          W="$(cygpath -m "$RUNNER_TEMP")"
          sed -i "s|D:/DEV/media_core/packages|$W/media_core/packages|g; \
                  s|D:/DEV/media-kit-predidit|$W/media-kit-predidit|g" pubspec.yaml
          grep -nE "media_core|media-kit-predidit" pubspec.yaml | head -6
        working-directory: ${{ github.workspace }}
        shell: bash

      # hvigorw.bat 垫片按 TOOL_HOME/tools/hvigor 布局查找工具链；
      # pub get 与 build 同步骤执行，避免环境切换触发 SDK 版本重解析
      - name: Build HAP (debug + release, unsigned)
        run: |
          export TOOL_HOME="$(cygpath -m "$HOME/ohos-sdk/command-line-tools")"
          export DEVECO_SDK_HOME="$(cygpath -m "$HOME/ohos-sdk/command-line-tools/sdk")"
          echo "TOOL_HOME=$TOOL_HOME"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && break
            echo "pub get failed, retrying ($i)..."; sleep 20
          done
          # 未签名构建在 HAP 生成后会因签名检查 throwToolExit(1)，
          # 以产物存在与否判定成败（verify 步骤兜底）
          flutter build hap --debug || true
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             pure_live_ohos_debug_unsigned.hap || true
          # release 需跳过 icon tree shaking：host 工具 const_finder 快照
          # 与定制 dart-sdk（kernel 138）SDK hash 不匹配（上游未重发 host 工具包）
          flutter build hap --release --no-tree-shake-icons || true
        working-directory: ${{ github.workspace }}
        shell: bash

      - name: Verify HAP libraries
        run: |
          python tool_verify_hap.py ./pure_live_ohos_debug_unsigned.hap || \
            python tool_verify_hap.py ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap
        working-directory: ${{ github.workspace }}
        shell: bash

      - name: Package output
        run: |
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             pure_live_ohos_release_unsigned.hap 2>/dev/null || true
          ls -la pure_live_ohos_*.hap || true
        working-directory: ${{ github.workspace }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pure_live_ohos
          path: |
            pure_live_ohos_debug_unsigned.hap
            pure_live_ohos_release_unsigned.hap
